[tool.ruff.lint]
ignore = [
    "I001",
    "UP031",
    "E722",    # Do not use bare `except`
    "BLE001",  # Do not catch blind exception: `Exception`
    "DTZ001",  # `datetime.datetime()` called without a `tzinfo` argument
    "RET501",  # Do not explicitly `return None`
    "PLR1711", # Useless `return` statement at end of function
    "RUF012",  # Mutable default value for class attribute
    "B006",    # Do not use mutable data structures for argument defaults
    "SIM115",  # Use a context manager for opening files
    "RUF100",  # Unused `noqa` directive
    "SIM103",  # Return the condition
    "B019",    # Use of `functools.lru_cache` can lead to memory leaks
    "PLR1704", # Redefining argument with the local name `offset`
]
#fixable = ["ALL"]
#unfixable = []
